spring:
  application:
    name: campus-lost-found
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/lostfound?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USER:lostfound}
    password: ${DB_PASSWORD:lostfound}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: 8080

app:
  upload:
    dir: ${UPLOAD_DIR:../.data/uploads}
