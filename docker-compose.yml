services:
  mysql:
    image: mysql:8.0
    container_name: lostfound-mysql
    # 本机已有 MySQL 占用 3306，这里映射到 3307 避免冲突
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lostfound
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - lostfound-mysql-data:/var/lib/mysql

volumes:
  lostfound-mysql-data:
