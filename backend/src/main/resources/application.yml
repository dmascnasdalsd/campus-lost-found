spring:
  application:
    name: campus-lost-found
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/lostfound?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USER:lostfound}
    password: ${DB_PASSWORD:lostfound}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: 8080

app:
  upload:
    dir: ${UPLOAD_DIR:../.data/uploads}
  jwt:
    # 开发默认密钥（至少 32 字节，HS256 要求）；生产通过环境变量覆盖。
    secret: ${JWT_SECRET:campus-lost-found-dev-secret-key-change-me-please}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
